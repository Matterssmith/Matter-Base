[package]
name = "matter-base"
version = "0.1.0"
edition = "2021"
description = "Reusable modular core for the Matterssmith ecosystem"
license = "MIT"

[lib]
name = "matter_base"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = {
    version = "0.3",
    features = ["env-filter", "fmt"]
}
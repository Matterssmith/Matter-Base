
[package]
name = "matter-base"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"

serde = {
    version = "1.0",
    features = ["derive"]
}

serde_json = "1.0"

tokio = {
    version = "1.0",
    features = ["macros", "rt-multi-thread", "signal"]
}

tracing = "0.1"

tracing-subscriber = {
    version = "0.3",
    features = ["env-filter", "fmt"]
}

whatsapp-rust = {
    version = "=0.7.0",
    default-features = false,
    features = [
        "tokio-runtime",
        "tokio-transport",
        "ureq-client",
        "sqlite-storage"
    ]
}
